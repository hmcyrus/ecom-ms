server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Dev-friendly CSP — allows browser to reach Keycloak on localhost:8180
    # directly for token exchange (OIDC PKCE code→token POST).
    # API calls go through the nginx proxy below so only 'self' is needed for those.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:8180; frame-src 'self' http://localhost:8180; frame-ancestors 'self'; base-uri 'self'; form-action 'self' http://localhost:8180;" always;

    # Vite hashed assets — immutable cache
    location /assets/ {
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy API calls to Docker Compose service names (replaces K8s DNS in default.conf)
    location /ecom/ {
        proxy_pass http://ecom-service:8080/ecom/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location /inven/ {
        proxy_pass http://inventory-service:8000/inven/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # SPA fallback — all routes served by index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}
